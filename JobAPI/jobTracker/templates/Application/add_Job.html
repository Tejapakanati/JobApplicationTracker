<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding New Job</title>
</head>
<body>
    <h1>Add Job Application</h1>
    <form action="{% url 'add_job' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="company">Company:</label>
            <input type="text" id="company" name="company" required>
        </div>

        <div class="form-group">
            <label for="job_title">Job Title:</label>
            <input type="text" id="job_title" name="job_title" required>
        </div>
        
        <div class="form-group">
            <label for="job_id">Job ID:</label>
            <input type="text" id="job_id" name="job_id">
        </div>

        <div class="form-group">
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" required>
        </div>

        <div class="form-group">
            <label for="job_date">Application Date:</label>
            <input type="date" id="job_date" name="job_date" required>
        </div>

        <div class="form-group">
            <label for="status">Status:</label>

                <select id="status" name="status">
                    <option value="">-- Select Status --</option>
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Selected">Selected</option>
                    <option value="Rejected">Rejected</option>
                    <option value="On Hold">On Hold</option>
                </select>
            </div>

        <div class="form-group">
            <label for="job_url">Job Url:</label>
            <input type="url" id="job_url" name="job_url" required>
        </div>

        <div class="form-group">
            <label for="source">Source:</label>
            <input type="text" id="source" name="source">
        </div>

        <div class="form-group">
            <label for="notes">Notes:</label>
            <input type="text" id="notes" name="notes">
        </div>

        <div class="form-group">
           <button type="submit">Add Job</button>
        </div>
        
    </form>
    <a href="{% url 'edit_applications' %}">
    <button type="button">Edit Applications</button>
</a>
</body>
</html>
